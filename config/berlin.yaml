# Berlin configuration for Task 1

bbox:
  low:  {lat: 52.3383, lon: 13.0884}
  high: {lat: 52.6755, lon: 13.7611}

sources:
  serper_maps: {enabled: true}
  places: {enabled: false}      # no Google billing account; optional
  osm: {enabled: true}
  gelbeseiten: {enabled: true}
  # Kept as full sources: 714 + 154 candidates not found by Serper Maps (overlap run 20261109T095036Z,
  # reason in run_log stage=decision). robots.txt allows the search pages on both.
  dasoertliche: {enabled: true}
  "11880": {enabled: true}
  search: {enabled: true}
  associations: {enabled: true}

serper_maps:
  queries: [Hausverwaltung, Immobilienverwaltung]
  spacing_km: 3          # start value; final value chosen from the pilot
  zoom: 14
  max_pages: 3
  min_new_per_page: 3    # stop paging when a page adds fewer new places
  pilot_points: 5

places:
  queries: [Hausverwaltung, Immobilienverwaltung, WEG-Verwaltung, Mietverwaltung]
  grid: 4                 # initial split: 4 x 4 tiles
  max_results: 60         # 3 pages x 20 = saturated tile -> split
  min_tile_edge_m: 300    # do not split below this edge length

directory_terms: [Hausverwaltung, Immobilienverwaltung, WEG-Verwaltung]

search_templates:
  bezirk: ["Hausverwaltung Berlin-{bezirk}"]
  ortsteil: ["WEG-Verwaltung Berlin {ortsteil}", "Immobilienverwaltung {ortsteil} Berlin"]

# Hard caps. Checked per run AND per calendar month (api_usage table).
caps:
  serper_credits: 1800    # per run, discover (serper_maps)
  serper_total: 2500      # free signup credits (one-time); all Serper use counts against this
  places_text_search: 4500
  places_details: 900
  tavily_credits: 900
  llm_extract: 1200       # LLM calls per run, per stage (proposed caps, not yet confirmed by the user)
  llm_classify: 1300
  llm_agent: 800
  llm_check: 50
  llm_kpi: 800            # Task 2: one call per confirmed company, <= 1 retry
  llm_month: 10000        # all LLM calls in a calendar month

# OpenRouter slugs per role (user choice 2026-11-09: gpt-4o-mini; structured outputs verified).
# check (spot check) skipped for now by user decision; must be a different family from extract.
models:
  extract: openai/gpt-4o-mini
  classify: openai/gpt-4o-mini
  agent: openai/gpt-4o-mini
  check: openai/gpt-4o-mini   # user choice; NOTE spec wants a different family from extract
  kpi: openai/gpt-4o-mini     # Task 2; default = same model as extract
prompts: {extract: 1, classify: 2, agent: 1, kpi: 1}
llm:
  temperature: 0
  max_text_chars: 12000   # page text sent to the model is cut here
  concurrency: 8

resolve:
  # Search cap = remaining Serper credits minus this reserve (search pilot + investigate)
  serper_reserve_credits: 300
  query: '"{name}" Berlin Impressum'
  domain_min_ratio: 80    # token_set_ratio(name, domain)
  group_min_ratio: 90     # fuzzy name at same street = same company across sources
  # Search order for candidates without a website: found by 2+ sources, then these keywords, then rest
  priority_keywords: [Hausverwaltung, Immobilienverwaltung, WEG, Mietverwaltung]

crawl:
  max_age_days: 30          # incremental: re-crawl a site only if older than this
  min_text_chars: 200       # less text than this -> Playwright, then Tavily Extract
  impressum_words: [impressum, imprint, rechtliches, anbieterkennzeichnung]
  fallback_paths: [/impressum, /impressum/, /impressum.html, /impressum.php, /de/impressum]
  about_words: [über uns, ueber-uns, ueber_uns, uber-uns, about, wir über uns, unternehmen]
  services_words: [leistungen, leistung, services, service]
  playwright_concurrency: 3
  playwright_timeout_s: 20

agent:                      # investigate stage (review queue); skipped for now by user decision
  enabled: false
  max_cases: 100
  max_steps: 8

dedupe:
  name_min_ratio: 90          # fuzzy name, only together with the same street + house number
  max_names_per_phone: 3      # a phone shared by more different names (switchboard) merges nothing

geo:
  nominatim_url: https://nominatim.openstreetmap.org/search

classify:
  # Word stems, matched case-insensitively in name, directory category and home/about/services text.
  # A keep-word wins over a drop-word (e.g. "Hausverwaltung und Hausmeisterservice" is kept).
  keep_words: [hausverwalt, immobilienverwalt, weg-verwalt, wegverwalt, wohnungseigentumsverwalt,
               mietverwalt, sondereigentumsverwalt, se-verwalt, grundstücksverwalt, grundstuecksverwalt,
               property management, objektverwalt]
  drop_words: [makler, hausmeister, gebäudereinigung, gebaeudereinigung, winterdienst, software,
               rechtsanwalt, rechtsanwält, kanzlei, interessenverband, mieterverein, eigentümerverband]
  max_chars_per_page: 4000

tavily_budgets:           # split of tavily_credits per stage
  discover: 250
  resolve: 500
  crawl: 150

