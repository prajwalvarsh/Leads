bezirke:
  Charlottenburg-Wilmersdorf: [Charlottenburg, Charlottenburg-Nord, Grunewald, Halensee, Schmargendorf, Westend, Wilmersdorf]
  Friedrichshain-Kreuzberg: [Friedrichshain, Kreuzberg]
  Lichtenberg: [Alt-Hohenschönhausen, Falkenberg, Fennpfuhl, Friedrichsfelde, Karlshorst, Lichtenberg, Malchow, Neu-Hohenschönhausen, Rummelsburg, Wartenberg]
  Marzahn-Hellersdorf: [Biesdorf, Hellersdorf, Kaulsdorf, Mahlsdorf, Marzahn]
  Mitte: [Gesundbrunnen, Hansaviertel, Mitte, Moabit, Tiergarten, Wedding]
  Neukölln: [Britz, Buckow, Gropiusstadt, Neukölln, Rudow]
  Pankow: [Blankenburg, Blankenfelde, Buch, Französisch Buchholz, Heinersdorf, Karow, Niederschönhausen, Pankow, Prenzlauer Berg, Rosenthal, Stadtrandsiedlung Malchow, Weißensee, Wilhelmsruh]
  Reinickendorf: [Borsigwalde, Frohnau, Heiligensee, Hermsdorf, Konradshöhe, Lübars, Märkisches Viertel, Reinickendorf, Tegel, Waidmannslust, Wittenau]
  Spandau: [Falkenhagener Feld, Gatow, Hakenfelde, Haselhorst, Kladow, Siemensstadt, Spandau, Staaken, Wilhelmstadt]
  Steglitz-Zehlendorf: [Dahlem, Lankwitz, Lichterfelde, Nikolassee, Steglitz, Wannsee, Zehlendorf]
  Tempelhof-Schöneberg: [Friedenau, Lichtenrade, Mariendorf, Marienfelde, Schöneberg, Tempelhof]
  Treptow-Köpenick: [Adlershof, Alt-Treptow, Altglienicke, Baumschulenweg, Bohnsdorf, Friedrichshagen, Grünau, Johannisthal, Köpenick, Müggelheim, Niederschöneweide, Oberschöneweide, Plänterwald, Rahnsdorf, Schmöckwitz]

# Stage confirm (after geo): sets "confirmed (website)" / "confirmed (listing)" (user decisions 2026-11-10)
confirm:
  # reasons that do not block "confirmed (website)": kept in Review reason as a flag
  website_flags: [housing company]
  # "regex disagrees on <field>" does not block either; it becomes "<field> uncertain" (the LLM value is kept)
  # no-website rows: a non-Google directory lists them under one of these categories (prefix match) ...
  listing_categories:
    dasoertliche: ["Haus- und Grundstücksverwaltungen"]
    gelbeseiten: ["Haus- und Grundstücksverwaltungen"]
    "11880": ["Hausverwaltung"]
    osm: ["office=property_management"]
  # ... and the name contains one of these (lowercase substring); a Bezirk is required too
  listing_name_words: [hausverwalt, immobilienverwalt, weg-verwalt, wegverwalt, wohnungseigentumsverwalt,
                       mietverwalt, sondereigentumsverwalt, se-verwalt, grundstücksverwalt, grundstuecksverwalt,
                       property management, objektverwalt,
                       wohnungsverwalt, grundbesitzverwalt, liegenschaftsverwalt, eigentumsverwalt, hausverw,
                       gebäudeverwalt, immobilien-verwalt, haus- und grundstücksverw, haus- u. grundstücksverw,
                       property services]
  # manual fixes after checking the page by hand (company_id: fields; evidence = verbatim quote + URL)
  overrides:
    5eec14251325:   # text extraction dropped the first line of the Impressum name
      company_name: Berlin-Kontor Verwaltungsgesellschaft mbH
      evidence: "Die Berlin-Kontor Verwaltungsgesellschaft mbH sucht sowohl wohnungswirtschaftlich genutzte Immobilien"
      url: https://www.berlin-kontor.de/
    5ae5696e07ee:   # "Berlin-Kontor Verwaltungs GmbH" (11880, review): same address Friedrichstr. 133, same name
      merge_into: 5eec14251325
    9db5b68298f1:   # classify quote shows it manages only its own holdings, not a management service
      status: review
      review_reason: "manages only its own property"
      evidence: "Die Boden-Finanz verwaltet den eigenen Grundbesitz mit Miet- und Eigentumswohnungen seit jeher selbst."
      url: http://www.boden-finanz.de

# ---------------- Task 2 ----------------
crawl_more:                # up to 3 more pages per confirmed company (team, jobs, references)
  team_words: [team, ansprechpartner, mitarbeiter, unser team, über uns, ueber-uns]
  jobs_words: [karriere, jobs, stellenangebote, stellenanzeigen, stellen, career]
  references_words: [referenzen, objekte, leistungen, verwaltungsobjekte]
  use_tavily: false         # Task 2: no new paid calls for pages

# Score weights (Task 2). Also written to the sheet's Weights tab, where the formulas read them.
weights:
  units_per_employee: 80        # estimate: managed units per employee when units are not stated
  default_units: 300            # units for companies with neither units nor employees known
  eur_per_unit_year: 25         # PLACEHOLDER: Heidi's real revenue per unit and year goes here
  base: 0.15                    # base probability that a company switches provider
  no_remote_reading: 0.10       # no mention of radio meters / remote reading -> retrofit need by 31.12.2026
  no_provider_named: 0.05       # no metering provider named -> less visible lock-in
  hiring: 0.05                  # growing; billing workload
  tenant_portal: 0.05           # digitally mature; values dashboards
  association_member: 0.05      # professional; VDIV is a warm channel
  owner_managed: 0.05           # Inhaber/owner decides quickly
  p_min: 0.05
  p_max: 0.60
  segment_weg_miet: 1.0
  segment_mixed: 0.7
  segment_se_only: 0.5
  segment_gewerbe_only: 0.3
  tier_a_share: 0.15            # top 15% by expected revenue (with data_confidence >= tier_a_min_confidence) -> A
  tier_b_share: 0.30            # next 30% -> B, rest C
  tier_a_min_confidence: 0.40

kpi:
  role_email_prefixes: [info, kontakt, contact, office, mail, email, verwaltung, hausverwaltung, buchhaltung,
                        service, post, hallo, hello, team, empfang, zentrale, vermietung, technik, bewerbung,
                        jobs, karriere, datenschutz, impressum, webmaster, admin, support, anfrage, anfragen,
                        rechnung, rechnungen, mieter, eigentuemer, weg, notfall, buero, sekretariat, objekte]

priority:                   # rules in docs/task2.md, checked top to bottom
  low_units_below: 30
  high_units_min: 200

linkedin:
  stop_below_credits: 20    # stop searching when remaining Serper credits drop below this
